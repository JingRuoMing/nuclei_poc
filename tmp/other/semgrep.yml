# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow file requires a free account on Semgrep.dev to
# manage rules, file ignores, notifications, and more.
#
# See https://semgrep.dev/docs/semgrep-ci/sample-ci-configs

name: Semgrep

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '33 14 * * 2'

permissions:
  contents: read

jobs:
  semgrep:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.174.0@sha256:f1f7b71861c7b28b6e0f661225a2c4f58a484f5d0f182465c6d6b3b22f972ade
    steps:
      # Checkout project source. Full history: `semgrep ci` runs a diff-aware scan on
      # pull_request and needs the base commit, which a depth-1 checkout does not have.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Semgrep
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          set -eu
          if [ -n "${SEMGREP_APP_TOKEN:-}" ]; then
            # Rules, ignores and notifications come from the project's policy on
            # https://semgrep.dev/manage
            semgrep ci --sarif --output=semgrep.sarif || true
          else
            # `semgrep ci` refuses to run without an account and writes no report.
            # Fall back to the default ruleset so the scan still happens.
            echo "SEMGREP_APP_TOKEN is not set - scanning with the default ruleset"
            semgrep scan --config=auto --sarif --output=semgrep.sarif || true
          fi
          # Semgrep exits non-zero when it has findings, and findings are reported
          # through the SARIF upload rather than by failing the job -- so the exit code
          # is ignored above and a missing report is what actually counts as a failure.
          if [ ! -f semgrep.sarif ]; then
            echo "::error::Semgrep produced no SARIF report"
            exit 1
          fi

      # Upload SARIF file generated in previous step
      - name: Upload SARIF file
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: semgrep.sarif
