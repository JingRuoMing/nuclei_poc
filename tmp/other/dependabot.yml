# Every ecosystem below carries a 7-day cooldown: a brand-new release can be
# malicious or simply broken, and nothing here is urgent enough to take on the
# day it ships. Dependabot security updates bypass the cooldown.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
